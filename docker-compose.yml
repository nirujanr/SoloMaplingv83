services:
  maplestory:
    build: .
    image: solomapling:latest
    container_name: solomapling
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8484:8484"            # Login server
      - "7575-7577:7575-7577"  # World 0, channels 1-3 (add 7675-7677 etc. if you add worlds)
    environment:
      DB_HOST: "db"            # Overrides DB_HOST in config.yaml
      JAVA_OPTS: "-Xmx3g"
    volumes:
      # Edit and restart (no rebuild) for these:
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      # Bot data (dialogue/item YAML, movement recordings, town pins). Writable so
      # in-game recordings and pin edits land back in your project folder.
      - ./src/main/java/soloMapling:/opt/server/src/main/java/soloMapling
      # Logs (cosmic-log, chat, trades, BotLog.txt) and the bot nav-graph cache
      - ./logs:/opt/server/logs
      - ./cache:/opt/server/cache
      # Free Market listings written every 30s for the fm-dashboard container
      - ./fm-dashboard/data:/opt/server/fmdata

  fm-dashboard:
    build: ./fm-dashboard
    image: solomapling-fm-dashboard:latest
    container_name: solomapling-fm-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"              # http://localhost:8080
    volumes:
      - ./fm-dashboard/data:/usr/share/nginx/html/data:ro

  db:
    image: mysql:8.4.0
    container_name: solomapling-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"            # For HeidiSQL/Workbench on the host
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # Named volume: faster and avoids permission issues vs. a Windows bind mount
      - db-data:/var/lib/mysql

volumes:
  db-data:
