server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Saved pictures (fetch-icons.ps1) don't change - let the browser cache them
    location /data/icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Listings change every 30s - never cache them
    location /data/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
